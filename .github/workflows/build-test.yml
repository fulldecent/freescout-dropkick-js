# Build and test
#
# Check PHP syntax, pack, and SLSA attest the module.
#
# This workflow produces the following things which release.yml consumes:
#   1. $.jobs.build-test (this exact job ID)
#   2. The artifact named "build"
#
# shivammathur/setup-php is not a GitHub-supported Action. It is how CI installs
# PHP 8.4 and PHP 8.5. Ubuntu's php package does not offer both.
# https://github.com/shivammathur/setup-php
#
# The service provider runs inside FreeScout, so this job checks syntax only.
#
# The zip is DropkickJS.zip, not the Composer archive name. FreeScout
# extracts the zip into Modules/ and requires that root folder name.
# version.txt is the module.json version with no v prefix. FreeScout compares
# that file to the installed module.json.
#
# Public repositories can use attest for free. Private repos require Enterprise Cloud.

name: Build and test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test and pack. Empty uses the workflow SHA.
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: php -l Providers/DropkickJSServiceProvider.php

  build-test:
    name: Build and test
    needs: php
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Pack
        run: |
          mkdir -p dist
          version="$(jq -r .version module.json)"
          file_version="$(tr -d '[:space:]' < version.txt)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "module.json version must look like 1.2.3" >&2; exit 1 ;;
          esac
          if [ "$version" != "$file_version" ]; then
            echo "module.json ($version) and version.txt ($file_version) disagree" >&2
            exit 1
          fi
          printf '%s\n' "$version" > dist/version.txt
          git archive --format=zip --prefix=DropkickJS/ -o dist/DropkickJS.zip HEAD
          unzip -l dist/DropkickJS.zip
          unzip -l dist/DropkickJS.zip | grep -q 'DropkickJS/module.json'
          unzip -l dist/DropkickJS.zip | grep -q 'DropkickJS/Providers/DropkickJSServiceProvider.php'
          unzip -l dist/DropkickJS.zip | grep -q 'DropkickJS/Public/img/module.png'
          unzip -l dist/DropkickJS.zip | grep -q 'DropkickJS/version.txt'

      # Fork pull requests get a read-only token. Attestation needs id-token write,
      # which that token does not have. The publish job attests the release build.
      - name: Attest the build
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      # After attesting, so the bundle is not one of its own subjects.
      - name: Add the attestation to the build
        if: steps.attest.outcome == 'success'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/attestation.sigstore.json

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
          if-no-files-found: error
          retention-days: 14
